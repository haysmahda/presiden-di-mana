# Publishes the website to GitHub Pages.
# Runs on every push to main — including the robot's own data commits, so a
# new location goes live within a minute or two of being found.
name: Terbitkan situs

on:
  push:
    branches: [main]

  # The scanner commits with the default GITHUB_TOKEN, and GitHub deliberately
  # does NOT fire `push` workflows for those commits (anti-recursion rule).
  # So a data commit alone would never publish — the site sat 3 weeks stale
  # because of exactly this. Chaining off the scanner's completion instead is
  # the documented fix and needs no secrets.
  workflow_run:
    workflows: ["Perbarui lokasi"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, publish the newer one and drop the older.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A failed scan leaves main unchanged, so there is nothing new to publish.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Susun folder situs
        # Only the files a visitor needs — not the scanner, the brief, or the
        # workflows. Paths in the HTML are relative, so the /presiden-di-mana/
        # sub-path works without any rewriting.
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html history.html _site/
          cp -r assets data _site/
          touch _site/.nojekyll

      - name: Bikin gambar share (og.png)
        # The share card names the current location, so it is regenerated on
        # every deploy. A failure here must never block publishing the site.
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund @resvg/resvg-js
          node scripts/og.js _site/og.png

      - name: Daftar berkas yang diterbitkan
        run: find _site -type f | sort | sed 's/^/  /'

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Unggah
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
